# 경로 설정. Colab에서는 zip을 /content로 복사해 푼 뒤 이 경로를 쓴다.
tsinghua:
  image_root: /content/data/low-resolution          # 클래스 폴더들이 있는 곳
  annotation_root: /content/data/Low-Annotations    # 이미지별 xml (몸통 박스). 실제 폴더 이름 확인 필요
  train_list: /content/data/TrainValSplit/train.lst
  val_list: /content/data/TrainValSplit/validation.lst

evalset:
  # A가 만드는 평가셋 인덱스. 열: image_id, dog_id, path, split(dev/test)
  # path는 D의 SAM 3 크롭 이미지 경로
  index_csv: /content/drive/MyDrive/cv_dog/evalset/eval_index.csv

outputs:
  features_root: /content/drive/MyDrive/cv_dog/features   # 특징 파일 (팀 공유)
  preds_root: /content/drive/MyDrive/cv_dog/preds          # 예측 CSV (팀 공유)
  logs_root: /content/drive/MyDrive/cv_dog/logs            # 실행 로그

classes:
  # 학습에서 제외하는 클래스 (제안서 3절)
  exclude: [chinese_rural_dog, dhole, African_hunting_dog]
  # dingo는 DNA 품종 목록 확인 후 결정. 제외하려면 true
  exclude_dingo: false
